name: Build APK from ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Source ZIP
        run: |
          unzip -o "*.zip" -d .
          if [ ! -f "Cargo.toml" ]; then
            SUBDIR=$(find . -maxdepth 2 -name "Cargo.toml" -printf "%h\n" | head -n 1)
            [ -n "$SUBDIR" ] && cp -rf "$SUBDIR"/* .
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK & SDK 34
        run: sdkmanager "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: taiki-e/install-action@cargo-ndk

      - name: Compile Rust Core
        run: |
          export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264
          cargo ndk -t arm64-v8a -t armeabi-v7a -o app/src/main/jniLibs build --release

      - name: Generate Keystore
        run: |
          keytool -genkeypair -v -keystore app/release.keystore \
            -alias rustchat -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rustchat123 -keypass rustchat123 \
            -dname "CN=RustChat, OU=Dev, O=Lite, L=ID, ST=ID, C=ID"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build & Pack APK
        run: |
          gradle assembleRelease
          zip -j RustChat-Android-APK.zip app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RustChat-Android-APK
          path: RustChat-Android-APK.zip
